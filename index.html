<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mboa Market</title>
  <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- en tete de page  -->
  <header id="entete">
    <div class="container">
      <div id="logo">
        <a href=""> Mboa<span>Market</span> </a>
      </div>

      <div id="menu">
        <a href="#" id="btn_panier">
          Panier
          <span> <i class="fa-solid fa-cart-shopping"> </i> </span>
          <span id="nb_articles" class="hide">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- conteneur de la page -->
  <main id="conteneur">
    <!-- section carrousel -->
    <section id="carrousel">

    </section>
    <!-- SECTION BOUTIQUE -->
    <section id="boutique">
      <div class="boutique_entete">
        <h2>Nos Produits du marché</h2>
        <p id="nb_resultats"></p>
      </div>

      <!--Filtre de recherche de produits-->
      <div class="boutique_outils">
        <div class="recherche">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" id="recherche" placeholder="Rechercher : poivre blanc, poulet..." />
        </div>
        <select id="tri">
          <option value="default">Trier par : recommandés</option>
          <option value="prix_croissant">Prix croissant</option>
          <option value="prix_decroissant">Prix décroissant</option>
          <option value="nom">Nom (A -> Z)</option>
        </select>
      </div>
      <div>

      </div>
      <!-- listes des categories -->
      <div id="categories"></div>
      <!-- liste des produits -->
      <div id="produits"></div>
    </section>
  </main>


  <!-- poed de page -->
  <footer id="pied">
    <p>
      <b>Mboa<span>Market</span></b>
      Le gout de ca livre chez vous
    </p>
    <p>Tel : 616 00 73 02 | email: mboa@iuc.com </p>
  </footer>

  <!--FENETRE MODAL PANIER-->
  <div id="modal_commande">
    <div class="modal_container">
      <span id="modal_fermer">
        <i class="fa-solod fa-xmark"></i>
      </span>
      <form id="modal_form" action="#" method="POST">
        <fieldset class="commande_info">
          <legend>Finaliser ma commande.</legend>
          <div class="champ">
            <label for="nom">Nom complet</label>
            <input type="text" name="nom" id="nom" placeholder="Ex : M. TEJIOGNI" required>
          </div>
          <div class="champ">
            <label for="telephone">Téléphone Mobile</label>
            <input type="number" name="telephone" id="telephone" placeholder="Ex : 6XX XX XX XX" required>
          </div>
          <div class="champ">
            <label for="ville">Ville de livraison</label>
            <select name="ville" id="ville">
              <option value="DOUALA">DOUALA</option>
              <option value="YAOUNDE">YAOUNDE</option>
              <option value="BUEA">BUEA</option>
              <option value="GAROUA">GAROUA</option>
            </select>
          </div>
          <div class="champ">
            <label for="paiement">Moyen de paiement</label>
            <select name="paiement" id="paiement">
              <option value="Orange Money">Orange Money</option>
              <option value="MTN Mobile Money">MTN Mobile Money</option>
            </select>
          </div>
        </fieldset>
        <fieldset class="commande_produit">
          <legend>Récapitulatif de la commande</legend>
          <table border="0" cellpadding="4" cellspacing="8">
            <thead>
              <tr>
                <th>PRODUIT</th>
                <th>PU (FCFA)</th>
                <th>QTE</th>
                <th>MONTANT (FCFA)</th>
                <th>OPTIONS</th>
              </tr>
            </thead>
            <tbody id="liste_produits">
            </tbody>
          </table>
          <div id="total_commande">
          </div>
          <div class="submit">
            <input type="submit" id="btn_valider" value="Valider la commande">
          </div>
        </fieldset>
      </form>
      <div id="confirmation">
        Confirmation produit ...
      </div>
    </div>

  </div>

  <!--gestion du javascript-->
  <script type="text/javascript" src="js/carrousel.js"></script>
  <script type="text/javascript" src="js/boutique.js"></script>
  <script type="text/javascript" src="js/script.js"></script>
</body>

</html>
